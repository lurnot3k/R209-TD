<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTANT WEATHER</title>
    <link rel="stylesheet" href="CSS/style.css"/>
</head>
<body>
    <script src="JS/fichier.js"></script>
    <script src="JS/meteo.js"></script>
    <div class="image">
        <a href="index.html">
            <img class="logo" src="assets/logo_météo.PNG">
        </a>
    </div>
    <h1>INSTANT WEATHER</h1>
    <div class="formulaire">
        <form method="post">
            <ul>
              <li>
                <label for="codepostal" class="copo" style="font-weight: bold">Code Postal</label>
                <input type="text" id="codepostal" name="codepostal" placeholder="Entrez un code postal..." class="copo"/>
              </li>
              <select id="communeSelect"></select>
              <li id="info_meteo" class="donnéeMétéo">
                <div class="meteomax" >
                </div>
                <div class="meteomin">
                </div>
                <div class="probapluie">
                </div>
                <div class="ensoleillement">
                </div>
              </li>
              <li class="bouton">
                <button type="submit" class="text_bouton">Envoyer</button>
              </li>
            </ul>
        </form>     
    </div>
    <div class="signature">
        <i>DUBOUST Arthur, LOUISFERT Corentin, GIRERD Lubin, RIBARDIERE Julien</i>
    </div>
</body>
</html>
